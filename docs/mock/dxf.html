<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>DXF Viewer — 25214_本体01.dxf</title>

  <!-- PWA メタタグ (v0.3) -->
  <meta name="theme-color" content="#1a1f24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body { background: #1a1f24; }

    .dxf-shell {
      display: grid;
      grid-template-rows: 56px auto 1fr 40px;
      height: 100vh;
      overflow: hidden;
    }

    .dxf-topbar {
      background: rgba(20, 26, 31, 0.95);
      backdrop-filter: blur(12px);
      color: #d4dae0;
      padding: 0 24px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid #2a3138;
    }
    .dxf-topbar .file-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
    }
    .dxf-topbar .file-sub {
      color: #8b96a3;
      font-size: 12px;
    }
    .dxf-close {
      margin-left: auto;
      width: 32px; height: 32px;
      border-radius: 8px;
      color: #d4dae0;
      display: grid; place-items: center;
    }
    .dxf-close:hover { background: #2a3138; }

    /* Tool bar */
    .dxf-toolbar {
      background: #252b32;
      color: #d4dae0;
      padding: 8px 24px;
      display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid #2a3138;
    }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      color: #d4dae0;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }
    .tool-btn:hover { background: #2f3640; }
    .tool-btn.active {
      background: var(--accent);
      color: white;
    }
    .tool-divider { width: 1px; height: 20px; background: #3a414a; margin: 0 6px; }
    .tool-spacer { flex: 1; }

    /* Canvas area */
    .dxf-canvas {
      background:
        radial-gradient(ellipse at center, #243038 0%, #1a1f24 100%);
      position: relative;
      overflow: hidden;
    }
    .dxf-canvas svg {
      width: 100%; height: 100%;
      display: block;
    }
    /* DXF entities styling */
    .dxf-line { stroke: #67E3F0; stroke-width: 1.5; fill: none; }
    .dxf-circle { stroke: #fbbb98; stroke-width: 1.5; fill: none; }
    .dxf-arc { stroke: #f4c873; stroke-width: 1.5; fill: none; }
    .dxf-dim-line { stroke: #94a3b8; stroke-width: 0.8; fill: none; }
    .dxf-text-cad { fill: #d4dae0; font-family: 'JetBrains Mono', monospace; font-size: 9px; }

    /* Measurement overlay */
    .measure-line {
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 4 3;
    }
    .measure-point {
      fill: var(--accent);
      stroke: white;
      stroke-width: 2;
    }
    .measure-label {
      fill: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .measure-label-bg {
      fill: var(--accent);
      rx: 6; ry: 6;
    }
    .measure-arc {
      stroke: var(--honey-2);
      stroke-width: 1.5;
      fill: none;
    }
    .measure-angle-bg {
      fill: var(--honey-deep);
      rx: 6; ry: 6;
    }

    /* Status bar */
    .dxf-statusbar {
      background: #252b32;
      color: #8b96a3;
      padding: 0 24px;
      display: flex; align-items: center; gap: 20px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid #2a3138;
    }
    .dxf-statusbar .sep { color: #555c66; }
    .dxf-statusbar .measure-readout {
      color: var(--accent);
      font-weight: 700;
    }

    /* Layers panel (左) */
    .layers-panel {
      position: absolute;
      top: 16px; left: 16px;
      background: rgba(37, 43, 50, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #3a414a;
      border-radius: 10px;
      padding: 12px 14px;
      color: #d4dae0;
      font-size: 12px;
      min-width: 200px;
    }
    .layers-title {
      font-size: 11px;
      font-weight: 700;
      color: #8b96a3;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .layer-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0;
    }
    .layer-color {
      width: 12px; height: 12px;
      border-radius: 3px;
    }

    /* Info panel (右) */
    .info-panel {
      position: absolute;
      top: 16px; right: 16px;
      background: rgba(37, 43, 50, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #3a414a;
      border-radius: 10px;
      padding: 12px 14px;
      color: #d4dae0;
      font-size: 12px;
      min-width: 220px;
    }
    .info-title {
      font-size: 11px;
      font-weight: 700;
      color: #8b96a3;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 3px 0;
    }
    .info-row strong { color: #d4dae0; font-family: 'JetBrains Mono', monospace; }
    .info-row span:first-child { color: #8b96a3; }

    /* Measurements list */
    .meas-list {
      position: absolute;
      bottom: 16px; right: 16px;
      background: rgba(37, 43, 50, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid #3a414a;
      border-radius: 10px;
      padding: 12px 14px;
      color: #d4dae0;
      font-size: 12px;
      min-width: 260px;
      max-height: 220px;
      overflow-y: auto;
    }
    .meas-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #3a414a;
    }
    .meas-row:last-child { border-bottom: 0; }
    .meas-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); }
    .meas-type {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #3a414a;
      color: #d4dae0;
    }
    .meas-clear {
      width: 100%;
      padding: 6px;
      margin-top: 6px;
      border: 1px solid #3a414a;
      border-radius: 6px;
      color: #d4dae0;
      font-size: 11px;
      background: transparent;
    }
    .meas-clear:hover { background: #3a414a; }

    /* ======================================================
       v0.3 モバイル / タブレット対応 (DXF Viewer)
    ====================================================== */
    @media (max-width: 1024px) {
      /* レイヤーパネル/情報パネル/測定一覧 のサイズ */
      .layers-panel { top: 10px; left: 10px; padding: 8px 10px; font-size: 11px; min-width: 160px; }
      .info-panel { top: 10px; right: 10px; padding: 8px 10px; font-size: 11px; min-width: 180px; }
      .meas-list { bottom: 10px; right: 10px; padding: 8px 10px; min-width: 220px; }
    }

    @media (max-width: 640px) {
      .dxf-topbar { padding: 0 12px; height: 52px; }
      .dxf-topbar .file-name { font-size: 13px; }
      .dxf-topbar .file-sub { display: none; }

      /* ツールバー: 大きめタッチターゲット */
      .dxf-toolbar { padding: 8px 10px; flex-wrap: wrap; gap: 4px; }
      .tool-btn { padding: 9px 12px; font-size: 12px; min-height: 38px; }
      .tool-btn svg { width: 16px; height: 16px; }
      .tool-divider { display: none; }

      /* パネルはコンパクト + 重ねない */
      .layers-panel { display: none; }  /* スマホでは省略 */
      .info-panel { display: none; }    /* スマホでは省略 */
      .meas-list {
        bottom: 60px; right: 8px; left: 8px;
        min-width: 0;
        max-height: 140px;
      }

      /* ステータスバー */
      .dxf-statusbar { padding: 0 12px; flex-wrap: wrap; gap: 6px 12px; font-size: 10px; }
      .dxf-statusbar > span:last-child { display: none; }  /* 「ホイール=ズーム」案内は省略 */

      /* 計測点・ラベルを大きく (タッチ精度のため) */
      .measure-point { stroke-width: 3; }
      .measure-line { stroke-width: 3; }
      .measure-label { font-size: 13px; font-weight: 700; }
      .measure-label-bg, .measure-angle-bg {
        rx: 8; ry: 8;
      }
    }

    @media (pointer: coarse) {
      .tool-btn { min-height: 40px; min-width: 40px; }
      .dxf-close { min-height: 44px; min-width: 44px; }
    }
  </style>
</head>
<body>

<div class="dxf-shell">

  <!-- TopBar -->
  <div class="dxf-topbar">
    <a href="detail.html" style="color: #d4dae0; display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      工番に戻る
    </a>
    <div style="flex: 0 0 auto; height: 24px; width: 1px; background: #3a414a;"></div>
    <div>
      <span class="file-name">25214_本体01.dxf</span>
      <span class="file-sub" style="margin-left: 10px;">本体ベース</span>
    </div>
    <button class="dxf-close" onclick="location.href='detail.html'">✕</button>
  </div>

  <!-- Toolbar -->
  <div class="dxf-toolbar">
    <button class="tool-btn active" id="tool-distance">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="12" x2="22" y2="12"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="20" cy="12" r="2" fill="currentColor"/></svg>
      距離計測
    </button>
    <button class="tool-btn" id="tool-angle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21 L3 3 L21 21 Z"/><path d="M9 21 A6 6 0 0 0 3 15"/></svg>
      角度計測
    </button>
    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      クリア
    </button>

    <div class="tool-divider"></div>

    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/></svg>
      リセット
    </button>

    <div class="tool-divider"></div>

    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      印刷
    </button>
    <button class="tool-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      DLパス
    </button>

    <div class="tool-spacer"></div>

    <span style="color: #8b96a3; font-size: 11px;">単位: mm ($INSUNITS=4)</span>
  </div>

  <!-- Canvas (DXF描画) -->
  <div class="dxf-canvas">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <!-- グリッド (背景) -->
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3138" stroke-width="0.5"/>
        </pattern>
        <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
          <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#3a414a" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <rect width="100%" height="100%" fill="url(#grid-major)"/>

      <!-- 原点クロス -->
      <g stroke="#5a6470" stroke-width="0.5">
        <line x1="600" y1="0" x2="600" y2="700"/>
        <line x1="0" y1="350" x2="1200" y2="350"/>
      </g>

      <!-- DXF entities (本体ベース) -->
      <!-- 外形 -->
      <rect class="dxf-line" x="350" y="180" width="500" height="340" rx="4"/>

      <!-- 内側形状 -->
      <rect class="dxf-line" x="400" y="220" width="400" height="260"/>
      <line class="dxf-line" x1="400" y1="350" x2="800" y2="350"/>
      <line class="dxf-line" x1="600" y1="220" x2="600" y2="480"/>

      <!-- 取付穴 (4箇所) -->
      <circle class="dxf-circle" cx="400" cy="220" r="14"/>
      <circle class="dxf-circle" cx="800" cy="220" r="14"/>
      <circle class="dxf-circle" cx="400" cy="480" r="14"/>
      <circle class="dxf-circle" cx="800" cy="480" r="14"/>

      <!-- 中央穴 -->
      <circle class="dxf-circle" cx="600" cy="350" r="40"/>
      <circle class="dxf-circle" cx="600" cy="350" r="60"/>

      <!-- 円弧 (コーナーR) -->
      <path class="dxf-arc" d="M 350 200 Q 350 180 370 180"/>
      <path class="dxf-arc" d="M 850 200 Q 850 180 830 180"/>
      <path class="dxf-arc" d="M 350 500 Q 350 520 370 520"/>
      <path class="dxf-arc" d="M 850 500 Q 850 520 830 520"/>

      <!-- 寸法線 (DXF内蔵) -->
      <g class="dxf-dim-line">
        <line x1="350" y1="550" x2="850" y2="550"/>
        <line x1="350" y1="545" x2="350" y2="555"/>
        <line x1="850" y1="545" x2="850" y2="555"/>
      </g>
      <text x="600" y="566" text-anchor="middle" class="dxf-text-cad">500.00</text>

      <g class="dxf-dim-line">
        <line x1="280" y1="180" x2="280" y2="520"/>
        <line x1="275" y1="180" x2="285" y2="180"/>
        <line x1="275" y1="520" x2="285" y2="520"/>
      </g>
      <text x="268" y="354" text-anchor="middle" class="dxf-text-cad" transform="rotate(-90 268 354)">340.00</text>

      <!-- ★ ユーザー測定オーバーレイ (距離) -->
      <g>
        <line class="measure-line" x1="400" y1="220" x2="800" y2="220"/>
        <circle class="measure-point" cx="400" cy="220" r="4"/>
        <circle class="measure-point" cx="800" cy="220" r="4"/>
        <rect class="measure-label-bg" x="572" y="194" width="56" height="20"/>
        <text class="measure-label" x="600" y="208" text-anchor="middle">400.00 mm</text>
      </g>

      <!-- ★ ユーザー測定オーバーレイ (角度) -->
      <g>
        <line class="measure-line" x1="600" y1="350" x2="800" y2="220" style="stroke: var(--honey-2);"/>
        <line class="measure-line" x1="600" y1="350" x2="800" y2="350" style="stroke: var(--honey-2);"/>
        <circle class="measure-point" cx="800" cy="220" r="4" style="fill: var(--honey-2);"/>
        <circle class="measure-point" cx="600" cy="350" r="4" style="fill: var(--honey-2);"/>
        <circle class="measure-point" cx="800" cy="350" r="4" style="fill: var(--honey-2);"/>
        <path class="measure-arc" d="M 660 350 A 60 60 0 0 0 643 314"/>
        <rect class="measure-angle-bg" x="655" y="324" width="42" height="18"/>
        <text class="measure-label" x="676" y="337" text-anchor="middle">33.0°</text>
      </g>

      <!-- ラベル -->
      <text x="600" y="60" text-anchor="middle" fill="#67E3F0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">25214_本体01 — 本体ベース</text>
      <text x="600" y="80" text-anchor="middle" fill="#8b96a3" font-family="'JetBrains Mono', monospace" font-size="11">SS400 t=12 / 表面処理: 黒染め</text>

    </svg>

    <!-- レイヤーパネル -->
    <div class="layers-panel">
      <div class="layers-title">レイヤー</div>
      <div class="layer-row">
        <span class="layer-color" style="background: #67E3F0;"></span>
        <input type="checkbox" checked />
        <span>外形 (LINE)</span>
      </div>
      <div class="layer-row">
        <span class="layer-color" style="background: #fbbb98;"></span>
        <input type="checkbox" checked />
        <span>穴 (CIRCLE)</span>
      </div>
      <div class="layer-row">
        <span class="layer-color" style="background: #f4c873;"></span>
        <input type="checkbox" checked />
        <span>R (ARC)</span>
      </div>
      <div class="layer-row">
        <span class="layer-color" style="background: #94a3b8;"></span>
        <input type="checkbox" checked />
        <span>寸法 (DIM)</span>
      </div>
      <div class="layer-row">
        <span class="layer-color" style="background: #d4dae0;"></span>
        <input type="checkbox" checked />
        <span>テキスト (TEXT)</span>
      </div>
    </div>

    <!-- 情報パネル -->
    <div class="info-panel">
      <div class="info-title">エンティティ情報</div>
      <div class="info-row"><span>LINE</span><strong>48</strong></div>
      <div class="info-row"><span>CIRCLE</span><strong>6</strong></div>
      <div class="info-row"><span>ARC</span><strong>4</strong></div>
      <div class="info-row"><span>DIMENSION</span><strong>12</strong></div>
      <div class="info-row"><span>TEXT</span><strong>8</strong></div>
      <div class="info-row" style="margin-top: 8px; border-top: 1px dashed #3a414a; padding-top: 8px;">
        <span>サイズ</span><strong>124 KB</strong>
      </div>
      <div class="info-row">
        <span>単位</span><strong>mm</strong>
      </div>
    </div>

    <!-- 測定一覧 -->
    <div class="meas-list">
      <div class="info-title">測定 (2)</div>
      <div class="meas-row">
        <span class="meas-type" style="background: rgba(6,182,212,0.2); color: var(--accent);">距離</span>
        <span class="meas-val">400.00 mm</span>
      </div>
      <div class="meas-row">
        <span class="meas-type" style="background: rgba(244,200,115,0.2); color: var(--honey-2);">角度</span>
        <span class="meas-val">33.0°</span>
      </div>
      <button class="meas-clear">すべてクリア</button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="dxf-statusbar">
    <span>X: <strong style="color: #d4dae0;">+247.50</strong></span>
    <span>Y: <strong style="color: #d4dae0;">+168.30</strong></span>
    <span class="sep">|</span>
    <span>Zoom: <strong style="color: #d4dae0;">100%</strong></span>
    <span class="sep">|</span>
    <span>モード: <span class="measure-readout">距離計測中</span></span>
    <span class="sep">|</span>
    <span>クリック1点目: <strong style="color: #d4dae0;">400, 220</strong></span>
    <span style="margin-left: auto;">
      ホイール=ズーム / ドラッグ=パン / ESC=終了
    </span>
  </div>

</div>


<script>
  // ツール切替
  document.querySelectorAll('.tool-btn').forEach(b => {
    if (b.id === 'tool-distance' || b.id === 'tool-angle') {
      b.addEventListener('click', () => {
        document.getElementById('tool-distance').classList.remove('active');
        document.getElementById('tool-angle').classList.remove('active');
        b.classList.add('active');
      });
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') location.href = 'detail.html';
  });
</script>

</body>
</html>
