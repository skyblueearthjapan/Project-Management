server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # アップロード上限: PDF / DXF (フォルダ単位の複数ファイル一括) を許容するため
    # nginx のデフォルト 1MB から十分大きく取る。
    # FastAPI 側は 1 ファイル 100MB (DXF) / 200MB (PDF) 上限を別途持つ。
    # ここでは「リクエストボディ全体 (フォルダで複数ファイル合算)」の上限を 1GB に。
    client_max_body_size 1024m;
    client_body_buffer_size 1m;
    # アップロード長時間化に備えて proxy タイムアウトも長めに
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    # .mjs (ESModule) は nginx 既定 mime.types に無いため、専用 location で
    # JavaScript MIME を返す。types {} を server レベルに置くと既定が全消えして
    # index.html まで octet-stream になりブラウザがダウンロードしてしまうので注意。
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA 配信
    location / {
        try_files $uri /index.html;
    }

    # API は同一オリジン /api/* で api コンテナへリバプロ
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック直結
    location = /health {
        proxy_pass http://api:8000/health;
    }
}
