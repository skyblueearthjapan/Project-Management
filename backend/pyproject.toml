[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "httpx>=0.27",
    "meilisearch-python-sdk>=3.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "watchfiles>=0.22",
    "ezdxf>=1.3",
    "apscheduler>=3.10",
    # PDF 1ページ目のサムネイル生成用 (工番一覧の左端に表紙を表示)。
    # 単一 pip wheel で済み、システム依存なし。
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "C4", "T20", "PT", "ASYNC"]
ignore = ["S101"]  # assert OK in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
