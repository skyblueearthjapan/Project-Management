# 購入部品追加依頼 エージェント 設定例
# このファイルを config.toml にコピー（手動）し、環境に合わせて値を変更してください。
# EXE と同じフォルダに置きます。

# DOVE バックエンドの API ベースURL（社内LAN内）
# 購入依頼は DOVE 一本に集約する（TTD には登録しない）。
# ステータスを持つデータを 2 箇所に置くと「片方だけ完了」事故が起きるため。
dove_base_url = "http://dove/api/v1"

# 送付先マスタ Excel。ファイルサーバ上に 1 つだけ置き、全員がここを読む。
# EXE と一緒に配布しない（各自の手元でバラバラにならないようにするため）。
# 列: ID / 名前 / Windowsアカウント / メールアドレス / 役割 / 依頼CC / 回答CC
#   役割:   設計 or 購買（この値で起動時の画面が切り替わる）
#   依頼CC: 設計→購買 の送信時に自動挿入（○=TO / CC / ×）
#   回答CC: 購買→設計 の返信時に自動挿入（同上）
master_xlsx_path = "\\\\lineworks-sv\\Data\\郵便局\\購入部品依頼\\購入部品依頼_送付先マスタ.xlsx"

# 工番マスタ（新一覧 / 日程表A）。社内全体で使う共有マスタのため固定パスを参照する。
# 工番→納入先/品名 の解決に使用。日程表A を優先し、無い工番は新一覧で補完する。
# ※ マスタは工番を枝番付き（25146-1）で持ち、DOVE は親工番（LW25146）で持つ。
#    照合は枝番キー、DOVE への登録は親工番、という二段構えで扱う。
master_nittei_path = "\\\\lineworks-sv\\Data\\総務部\\社内\\日程表\\日程表A.xlsx"
master_shin_ichiran_path = "\\\\lineworks-sv\\Data\\総務部\\社内\\日程表\\新一覧.xlsm"

# DOVE API 呼び出しのタイムアウト秒。
# 部品リスト Excel / 手配結果 PDF のアップロードを伴うため、
# 出図EXE（15秒）より長めに取る。
request_timeout_sec = 30
